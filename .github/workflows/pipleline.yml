
name: Pipeline Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Comprobar Dockerfile
        run: |
          pwd
          ls -la
          test -f Dockerfile

      - name: Construir imagen Docker
        run: docker build -t ipod_classic_image .
